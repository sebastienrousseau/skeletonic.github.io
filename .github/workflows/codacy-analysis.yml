# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ main, skeletonic-main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: '25 22 * * 3'

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08  # v4.4.7
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Codacy CLI emits a single SARIF file containing one run per
      # underlying analyser (rubocop, eslint, markdownlint, …) and
      # sometimes multiple runs from the same analyser (e.g. one per
      # file set). Since 2025-07-21 GitHub Code Scanning rejects any
      # multi-run SARIF where two runs share a category, so we tag
      # each run with a unique `automationDetails.id` of the form
      # `codacy/<analyser>/<index>/`. The index keeps duplicate
      # analyser names disambiguated; the position is stable across
      # pushes because the Codacy CLI emits runs in deterministic
      # order, which lets GitHub replace each category cleanly on
      # subsequent uploads.
      # Ref: https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
      - name: Tag SARIF runs with per-analyser categories
        run: |
          set -euo pipefail
          if [ ! -s results.sarif ]; then
            echo "no results.sarif — nothing to tag"
            exit 0
          fi
          jq '.runs |= [
                range(0; length) as $i
                | .[$i]
                | . + {
                    automationDetails: {
                      id: ("codacy/" + ((.tool.driver.name // "run") | ascii_downcase | gsub("[^a-z0-9_-]"; "-")) + "/" + ($i | tostring) + "/")
                    }
                  }
              ]' results.sarif > results.tagged.sarif
          mv results.tagged.sarif results.sarif
          echo "tagged $(jq '.runs | length' results.sarif) run(s):"
          jq -r '.runs[].automationDetails.id' results.sarif | sed 's/^/  /'
          # Sanity check: fail fast if any two runs ended up with the
          # same category — that would reproduce the upload error and
          # is much cheaper to diagnose here than in the upload step.
          dup=$(jq -r '.runs[].automationDetails.id' results.sarif | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::duplicate SARIF categories after tagging:"
            printf '%s\n' "$dup"
            exit 1
          fi

      # Upload the (now-categorised) SARIF file to Code Scanning
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: results.sarif
